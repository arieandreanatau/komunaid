openapi: "3.0.3"
info:
  title: KomunaID API
  description: |
    KomunaID - Community-Tech Platform REST API
    
    A comprehensive platform for managing communities, organizations, events, and user interactions.
    
    ## Authentication
    All authenticated endpoints require a Bearer token in the Authorization header:
    ```
    Authorization: Bearer <jwt_token>
    ```
    
    ## Rate Limiting
    - POST /auth/login: 5 requests/minute
    - POST /auth/register: 3 requests/minute
    - POST /auth/forgot-password: 3 requests/minute
    - General endpoints: 100 requests/minute
  version: "1.0.0"
  contact:
    name: KomunaID Team
    email: api@komunaid.com
  license:
    name: MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server

tags:
  - name: Health
    description: Health check
  - name: Auth
    description: Authentication and registration
  - name: Profile
    description: User profile management
  - name: Role Requests
    description: Role upgrade requests
  - name: Communities
    description: Community management
  - name: Community Members
    description: Community membership management
  - name: Organizations
    description: Organization management
  - name: Events
    description: Event management
  - name: Notifications
    description: User notifications
  - name: Reports
    description: Content moderation reports
  - name: Admin
    description: Platform administration
  - name: Upload
    description: File upload management
  - name: Audit Logs
    description: System audit trail

security:
  - BearerAuth: []

paths:
  # ========== Health ==========
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          timestamp:
                            type: string
                            format: date-time

  # ========== Authentication ==========
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: "SecurePass123!"
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: "^[a-zA-Z0-9_-]+$"
                  example: johndoe
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email or username already taken
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      summary: Logout and invalidate tokens
      tags: [Auth]
      requestBody: null
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      summary: Send password reset email
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent (always returns 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ========== Profile ==========
  /users/me:
    get:
      summary: Get current user profile
      tags: [Profile]
      responses:
        "200":
          description: Profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      summary: Update current user profile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  maxLength: 100
                lastName:
                  type: string
                  maxLength: 100
                avatar:
                  type: string
                  maxLength: 500
                bio:
                  type: string
                  maxLength: 500
                location:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 20
                interests:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{username}:
    get:
      summary: Get user public profile by username
      tags: [Profile]
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PublicUser"
        "404":
          $ref: "#/components/responses/NotFound"

  # ========== Role Requests ==========
  /role-requests:
    post:
      summary: Submit a role upgrade request
      tags: [Role Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedRoleId, reason]
              properties:
                requestedRoleId:
                  type: integer
                reason:
                  type: string
                  minLength: 10
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RoleUpgradeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Pending request already exists

    get:
      summary: List all role upgrade requests (admin)
      tags: [Role Requests]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        "200":
          description: Role requests listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleUpgradeRequest"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /role-requests/{id}:
    patch:
      summary: Approve or reject a role request (admin)
      tags: [Role Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                reviewNote:
                  type: string
      responses:
        "200":
          description: Request reviewed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RoleUpgradeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ========== Communities ==========
  /communities:
    get:
      summary: List all communities
      tags: [Communities]
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/SortParam"
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, SUSPENDED, ARCHIVED]
        - name: membershipType
          in: query
          schema:
            type: string
            enum: [open, approval, invite_only]
        - name: isVerified
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Communities listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommunitySummary"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

    post:
      summary: Create a new community
      tags: [Communities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                shortDescription:
                  type: string
                  maxLength: 255
                logo:
                  type: string
                  maxLength: 500
                banner:
                  type: string
                  maxLength: 500
                category:
                  type: string
                location:
                  type: string
                website:
                  type: string
                  format: uri
                contactEmail:
                  type: string
                  format: email
                contactPhone:
                  type: string
                membershipType:
                  type: string
                  enum: [open, approval, invite_only]
                  default: open
                maxMembers:
                  type: integer
                  minimum: 2
      responses:
        "201":
          description: Community created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Community"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Name already taken

  /communities/{slug}:
    get:
      summary: Get community by slug
      tags: [Communities]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Community retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Community"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{id}:
    patch:
      summary: Update a community
      tags: [Communities]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                shortDescription:
                  type: string
                logo:
                  type: string
                banner:
                  type: string
                category:
                  type: string
                location:
                  type: string
                website:
                  type: string
                contactEmail:
                  type: string
                contactPhone:
                  type: string
                membershipType:
                  type: string
                maxMembers:
                  type: integer
      responses:
        "200":
          description: Community updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Community"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete a community
      tags: [Communities]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Community deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{id}/join:
    post:
      summary: Join a community
      tags: [Communities]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Joined community
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CommunityMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{id}/leave:
    post:
      summary: Leave a community
      tags: [Communities]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /communities/{id}/members/approve:
    post:
      summary: Approve a community member
      tags: [Community Members]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: Member approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CommunityMember"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{id}/members/reject:
    post:
      summary: Reject a community member
      tags: [Community Members]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
                reason:
                  type: string
      responses:
        "200":
          description: Member rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{id}/status:
    patch:
      summary: Update community status (admin)
      tags: [Communities]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED, SUSPENDED, ARCHIVED]
                statusReason:
                  type: string
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Community"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{id}/members:
    get:
      summary: List community members
      tags: [Community Members]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: role
          in: query
          schema:
            type: string
            enum: [OWNER, ADMIN, MODERATOR, MEMBER]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, BANNED, PENDING]
      responses:
        "200":
          description: Members listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommunityMember"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

  /communities/{id}/members/{userId}/role:
    patch:
      summary: Update community member role
      tags: [Community Members]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [ADMIN, MODERATOR, MEMBER]
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CommunityMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{id}/members/{userId}/ban:
    patch:
      summary: Ban or unban a community member
      tags: [Community Members]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [BANNED, ACTIVE]
                reason:
                  type: string
      responses:
        "200":
          description: Ban status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CommunityMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ========== Organizations ==========
  /organizations:
    get:
      summary: List all organizations
      tags: [Organizations]
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/SortParam"
        - name: industry
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, SUSPENDED]
      responses:
        "200":
          description: Organizations listed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrganizationSummary"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

    post:
      summary: Create a new organization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                shortDescription:
                  type: string
                  maxLength: 255
                logo:
                  type: string
                banner:
                  type: string
                industry:
                  type: string
                location:
                  type: string
                website:
                  type: string
                  format: uri
                contactEmail:
                  type: string
                  format: email
                foundedAt:
                  type: string
                  format: date
                size:
                  type: string
                  enum: ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"]
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Name already taken

  /organizations/{slug}:
    get:
      summary: Get organization by slug
      tags: [Organizations]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:

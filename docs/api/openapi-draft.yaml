      responses:
        "200":
          description: Audit log retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuditLog"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ========== Components ==========
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token (15 minutes expiry) obtained from /auth/login or /auth/register. Refresh token expires in 30 days."

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Items per page

    SearchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search query string

    SortParam:
      name: sort
      in: query
      schema:
        type: string
        default: "-created_at"
      description: "Sort field (prefix '-' for descending)"

  schemas:

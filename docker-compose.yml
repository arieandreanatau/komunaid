services:
  mysql:
    image: mysql:8.0
    container_name: komunaid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: komunaid
      MYSQL_USER: ${MYSQL_USER:-komunaid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-komunaid}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - komunaid-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: komunaid-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-komunaid}:${MYSQL_PASSWORD:-komunaid}@mysql:3306/komunaid
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: 30d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - komunaid-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: komunaid-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - komunaid-network

networks:
  komunaid-network:
    driver: bridge

volumes:
  mysql_data:

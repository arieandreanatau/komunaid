name: Deploy API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @komunaid/shared build
      - run: pnpm --filter @komunaid/api build
      - name: Generate Prisma Client
        run: pnpm --filter @komunaid/database db:generate
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: |
            apps/api/dist/
            packages/shared/dist/
            packages/database/prisma/
            node_modules/
          retention-days: 7
